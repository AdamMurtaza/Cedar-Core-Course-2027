<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 20px;
            background: #eee;
            border-radius: 8px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, select, button {
            padding: 10px;
        }
        .btn-reset {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .canvas-wrapper {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Budget Tracker</h1>
            <button class="btn-reset" id="btn-reset">Reset All Data</button>
        </div>

        <div class="stats">
            <div>Income: <b id="stat-income">$0</b></div>
            <div>Expenses: <b id="stat-expenses">$0</b></div>
            <div>Balance: <b id="stat-balance">$0</b></div>
        </div>

        <div class="input-group">
            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <input type="text" id="desc" placeholder="Description">
            <input type="number" id="amt" placeholder="Amount">
            <select id="cat">
                <option>Food</option>
                <option>Rent</option>
                <option>Fun</option>
                <option>Other</option>
            </select>
            <button id="btn-add">Add</button>
        </div>

        <table>
            <thead>
                <tr><th>Description</th><th>Category</th><th>Amount</th></tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>

        <div class="canvas-wrapper">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <script type="py">
        import json
        from pyscript import document, window
        from pyodide.ffi import create_proxy

        data = []
        my_chart = None

        # Load data from LocalStorage
        saved_data = window.localStorage.getItem('simple_budget')
        if saved_data:
            data = json.loads(saved_data)

        def update_dashboard():
            global my_chart
            # Save to localStorage
            window.localStorage.setItem('simple_budget', json.dumps(data))

            # Clear existing table rows
            body = document.getElementById('table-body')
            body.innerHTML = ''

            inc = 0.0
            exp = 0.0
            cat_totals = {}

            # Populate table rows and aggregate stats
            for item in data:
                row = body.insertRow()
                
                cell_desc = row.insertCell(0)
                cell_cat = row.insertCell(1)
                cell_amt = row.insertCell(2)

                cell_desc.innerText = item['desc']
                cell_cat.innerText = item['cat']
                cell_amt.innerText = f"${item['amt']}"

                amt = float(item['amt'])
                if item['type'] == 'income':
                    inc += amt
                else:
                    exp += amt
                    cat_totals[item['cat']] = cat_totals.get(item['cat'], 0.0) + amt

            # Update HTML statistics labels
            document.getElementById('stat-income').innerText = f"${inc}"
            document.getElementById('stat-expenses').innerText = f"${exp}"
            document.getElementById('stat-balance').innerText = f"${inc - exp}"

            # Destroy prior Chart.js instance before re-rendering
            if my_chart is not None:
                my_chart.destroy()

            labels = list(cat_totals.keys())
            values = list(cat_totals.values())

            # Configure Chart.js options using Pyodide JS objects
            chart_config = window.Object.new()
            chart_config.type = 'pie'
            
            data_obj = window.Object.new()
            data_obj.labels = labels

            dataset = window.Object.new()
            dataset.data = values
            dataset.backgroundColor = ['#3498db', '#e74c3c', '#27ae60', '#f1c40f']

            data_obj.datasets = [dataset]
            chart_config.data = data_obj

            options = window.Object.new()
            options.responsive = True
            options.maintainAspectRatio = False
            chart_config.options = options

            # Render Chart.js
            ctx = document.getElementById('chart')
            my_chart = window.Chart.new(ctx, chart_config)

        def add_transaction(event):
            type_val = document.getElementById('type').value
            desc_val = document.getElementById('desc').value.strip()
            amt_raw = document.getElementById('amt').value
            cat_val = document.getElementById('cat').value

            if desc_val and amt_raw != '':
                try:
                    amt_val = float(amt_raw)
                    data.append({
                        'type': type_val,
                        'desc': desc_val,
                        'amt': amt_val,
                        'cat': cat_val
                    })
                    update_dashboard()
                    document.getElementById('desc').value = ''
                    document.getElementById('amt').value = ''
                except ValueError:
                    pass

        def reset_data(event):
            global data
            if window.confirm('Are you sure you want to delete all transactions?'):
                data = []
                update_dashboard()

        # Bind Python button click handlers safely
        document.getElementById('btn-add').addEventListener('click', create_proxy(add_transaction))
        document.getElementById('btn-reset').addEventListener('click', create_proxy(reset_data))

        # Initial render on launch
        update_dashboard()
    </script>
</body>
</html>
