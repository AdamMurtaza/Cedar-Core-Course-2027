<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knight's Budget Planner</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        :root {
            --primary: #0284c7;       /* Soft ocean blue */
            --secondary: #0369a1;     /* Deep navy accent */
            --success: #06b6d4;       /* Bright light blue/cyan */
            --danger: #ef4444;        /* Soft red for expenses */
            --bg: #f0f7ff;            /* Light blue page background */
            --card-bg: #ffffff;
            --card-border: #e0f2fe;    /* Very soft blue border */
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 25px;
            color: var(--text-main);
        }

        .dashboard-container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .value {
            font-size: 2rem;
            font-weight: 800;
            margin: 10px 0;
        }

        .progress-container {
            height: 8px;
            background: #e0f2fe;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.5s;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        .section-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 6px rgba(2, 132, 199, 0.03);
        }

        .canvas-wrapper {
            position: relative;
            flex-grow: 1;
            min-height: 350px;
        }

        .input-bar {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 6px rgba(2, 132, 199, 0.03);
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select {
            padding: 12px;
            border: 1px solid #bae6fd;
            background-color: #f8fafc;
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #bae6fd;
            color: var(--secondary);
        }

        .btn-outline:hover {
            background: #e0f2fe;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .insight-box {
            background: #e0f2fe;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid var(--primary);
            color: #0369a1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            text-align: left;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 10px;
            border-bottom: 2px solid #e0f2fe;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <div>
                <h1 style="margin: 0; color: #0284c7;">⚔️ Knight's Budget Planner</h1>
                <p style="color: var(--text-muted); margin: 5px 0 0 0;">Track, analyze, and optimize your wealth</p>
            </div>
            <div class="actions">
                <button class="btn btn-outline" id="btn-export">Export CSV</button>
                <button class="btn btn-danger" id="btn-reset">Reset</button>
            </div>
        </div>

        <div class="kpi-row">
            <div class="card">
                <h3>Total Income</h3>
                <div class="value" id="stat-income">$0.00</div>
            </div>
            <div class="card">
                <h3>Expenses</h3>
                <div class="value" id="stat-expenses" style="color: var(--danger);">$0.00</div>
            </div>
            <div class="card">
                <h3>Burn Rate</h3>
                <div class="value" id="stat-burn">0%</div>
                <div class="progress-container">
                    <div class="progress-bar" id="burn-progress"></div>
                </div>
            </div>
            <div class="card">
                <h3>Net Savings</h3>
                <div class="value" id="stat-balance" style="color: var(--primary);">$0.00</div>
            </div>
        </div>

        <div class="input-bar">
            <div class="form-group">
                <label>Type</label>
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="desc" placeholder="Rent, Salary...">
            </div>
            <div class="form-group">
                <label>Amount ($)</label>
                <input type="number" id="amt" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="cat">
                    <option>Housing</option>
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Utilities</option>
                    <option>Leisure</option>
                    <option>Investing</option>
                    <option>Salary</option>
                </select>
            </div>
            <button id="btn-add" class="btn btn-primary">Add Record</button>
        </div>

        <div class="main-grid">
            <div class="section-card">
                <h3 style="margin-top: 0;">Expense Distribution</h3>
                <div class="canvas-wrapper">
                    <canvas id="chart"></canvas>
                </div>
            </div>
            <div class="section-card">
                <h3 style="margin-top: 0;">Recent Activity</h3>
                <div style="overflow-y: auto; max-height: 250px;">
                    <table id="trans-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
                <div class="insight-box" id="insight-text">
                    Start adding records to see spending insights.
                </div>
            </div>
        </div>
    </div>

    <script type="py">
        import json
        from pyscript import document, window
        from pyodide.ffi import create_proxy

        # Global storage variables
        transactions = []
        chart_instance = None

        # Load existing data from browser LocalStorage on page load
        saved_data = window.localStorage.getItem('knights_budget_data')
        if saved_data:
            transactions = json.loads(saved_data)

        def update_dashboard():
            """
            Recalculates metrics, updates HTML elements, 
            renders the summary table, and updates the pie chart.
            """
            global chart_instance

            # Save data to LocalStorage
            window.localStorage.setItem('knights_budget_data', json.dumps(transactions))

            # Clear current table rows
            table_body = document.getElementById('table-body')
            table_body.innerHTML = ''

            total_income = 0.0
            total_expenses = 0.0
            category_totals = {}

            # Process all recorded transactions
            for item in transactions:
                new_row = table_body.insertRow(0)
                category_cell = new_row.insertCell(0)
                amount_cell = new_row.insertCell(1)

                category_cell.innerText = item['cat']
                amount_cell.innerText = f"${item['amt']:,.2f}"

                amount = float(item['amt'])
                if item['type'] == 'income':
                    total_income = total_income + amount
                else:
                    total_expenses = total_expenses + amount
                    if item['cat'] in category_totals:
                        category_totals[item['cat']] = category_totals[item['cat']] + amount
                    else:
                        category_totals[item['cat']] = amount

            # Calculate burn rate percentage
            if total_income > 0:
                burn_rate = (total_expenses / total_income) * 100
            else:
                burn_rate = 0.0

            # Update KPI card values on screen
            net_savings = total_income - total_expenses
            document.getElementById('stat-income').innerText = f"${total_income:,.2f}"
            document.getElementById('stat-expenses').innerText = f"${total_expenses:,.2f}"
            document.getElementById('stat-balance').innerText = f"${net_savings:,.2f}"
            document.getElementById('stat-burn').innerText = f"{burn_rate:.0f}%"

            # Set progress bar width
            progress_width = min(burn_rate, 100)
            document.getElementById('burn-progress').style.width = f"{progress_width}%"

            # Generate insightful messaging
            if burn_rate > 80:
                insight_message = "⚠️ Warning: High burn rate. Review your leisure spending."
            elif len(category_totals) > 0:
                highest_category = max(category_totals, key=category_totals.get)
                insight_message = f"💡 Fact: Your biggest expense is <b>{highest_category}</b>."
            else:
                insight_message = "Everything looks balanced."
            
            document.getElementById('insight-text').innerHTML = insight_message

            # Re-draw the Chart.js doughnut chart using a light-blue color palette
            if chart_instance is not None:
                chart_instance.destroy()

            chart_canvas = document.getElementById('chart')
            
            chart_config = window.Object.new()
            chart_config.type = 'doughnut'

            dataset = window.Object.new()
            dataset.data = list(category_totals.values())
            dataset.backgroundColor = ['#0284c7', '#38bdf8', '#7dd3fc', '#bae6fd', '#0284c7', '#0369a1']

            chart_data = window.Object.new()
            chart_data.labels = list(category_totals.keys())
            chart_data.datasets = [dataset]

            chart_options = window.Object.new()
            chart_options.responsive = True
            chart_options.maintainAspectRatio = False

            chart_config.data = chart_data
            chart_config.options = chart_options

            chart_instance = window.Chart.new(chart_canvas, chart_config)


        def add_transaction_handler(event):
            """Handler function to add a new transaction entry."""
            description_input = document.getElementById('desc')
            amount_input = document.getElementById('amt')
            category_input = document.getElementById('cat')
            type_input = document.getElementById('type')

            description_value = description_input.value.strip()
            amount_value = amount_input.value

            if description_value != '' and amount_value != '':
                try:
                    parsed_amount = float(amount_value)
                    transactions.append({
                        'type': type_input.value,
                        'desc': description_value,
                        'amt': parsed_amount,
                        'cat': category_input.value
                    })
                    
                    update_dashboard()

                    description_input.value = ''
                    amount_input.value = ''
                except ValueError:
                    pass


        def export_csv_handler(event):
            """Generates and triggers a download of transactions in CSV format."""
            csv_content = "Type,Description,Amount,Category\n"
            for item in transactions:
                csv_content = csv_content + f"{item['type']},{item['desc']},{item['amt']},{item['cat']}\n"

            blob = window.Blob.new([csv_content], window.Object.new())
            blob.type = "text/csv"
            
            download_link = document.createElement('a')
            download_link.href = window.URL.createObjectURL(blob)
            download_link.download = "knights_budget_export.csv"
            download_link.click()


        def reset_all_handler(event):
            """Clears all stored data after confirmation."""
            global transactions
            if window.confirm("Purge all financial data?"):
                transactions = []
                update_dashboard()


        # Create proxies for Python functions
        add_proxy = create_proxy(add_transaction_handler)
        reset_proxy = create_proxy(reset_all_handler)
        export_proxy = create_proxy(export_csv_handler)

        # Attach event listeners to buttons
        document.getElementById('btn-add').addEventListener('click', add_proxy)
        document.getElementById('btn-reset').addEventListener('click', reset_proxy)
        document.getElementById('btn-export').addEventListener('click', export_proxy)

        # Initial render on page load
        update_dashboard()
    </script>
</body>
</html>
